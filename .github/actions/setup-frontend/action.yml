# フロント（管理画面・店舗画面・E2E）の job の共通の準備：pnpm と Node の準備、workspace の依存のインストール
name: フロントの準備
description: pnpm（バージョンはルートの package.json の packageManager）と Node を用意し、workspace の依存を入れる

runs:
  using: composite
  steps:
    # 依存のストアをキャッシュする（キーはルートの pnpm-lock.yaml）
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: package.json
        cache: true
        cache_dependency_path: pnpm-lock.yaml

    - uses: actions/setup-node@v7
      with:
        # バージョンはルートの .node-version。package.json の engines.node は範囲（>=24）で、最新のバージョンに解決されるため使わない
        node-version-file: .node-version

    - name: 依存のインストール
      shell: bash
      run: pnpm install --frozen-lockfile
