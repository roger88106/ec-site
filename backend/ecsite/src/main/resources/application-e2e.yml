# ============================================================================
# E2E 用の設定（plan 004 第 6.1 節）
#
# local profile に重ねて使う：spring.profiles.active=local,e2e
# ローカルとの違いだけを書く。DB・IdP・画像のバケットを E2E 用に分け、ローカルのデータを変えない。
# ポートも分けるので、手元の開発のバックエンド（8080）と並べて動かせる。
# DB（ec_site_e2e）と IdP の database は、E2E の準備の script（e2e/scripts/prepare.ts）が毎回作り直す。
# ============================================================================

server:
  port: 8090

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ec_site_e2e
  flyway:
    # 画面で見るためのデータ（seed/local）は入れない。E2E は要るデータを API で作る（db/seed/local/README.md）
    locations: classpath:db/migration,classpath:db/seed/base

ecsite:
  media:
    storage:
      # compose の seaweedfs-init が作る E2E 用のバケット
      incoming-bucket: ec-site-e2e-images-incoming
      public-bucket: ec-site-e2e-images
      public-base-url: http://localhost:8333/ec-site-e2e-images
  security:
    # compose の E2E 用の Keycloak（profile e2e）
    admin:
      issuer-uri: http://localhost:8181/realms/ec-admin
    store:
      issuer-uri: http://localhost:8181/realms/ec-store
