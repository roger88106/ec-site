# ============================================================================
# CI（constitution 13）
#
# push と pull request で実行する。CI が失敗している状態で、次の spec の実装に進まない。
#   backend：ビルド、単体・統合テスト、OpenAPI の構文の検証（./gradlew build に含まれる）
#   admin：管理画面の lint（Biome）、型チェック、テスト、ビルド
#   store：店舗画面の lint（Biome）、型チェック、テスト、ビルド（ビルドはバックエンドなしで通る）
#   e2e：バックエンド、管理画面、店舗画面を起動して、ブラウザで操作する（Playwright）
# ============================================================================

name: CI

on:
  # CI の結果に関わらないファイルだけを変えた push では流さない（constitution 13）。
  # 1 つでも他のファイルが含まれていれば、すべての job を流す
  push:
    paths-ignore:
      - '**.md'           # 文書、skill の本文
      - '.claude/**'      # エージェントの設定と、ローカルの画面の確認の設定
      - 'scripts/dev/**'  # ローカル用の script（CI で使う script は scripts/ci/ に置く）
      - '.gitignore'
      - 'LICENSE'
  # pull request は、変えたファイルによらずいつも流す（main に入る前に必ず確かめる）
  pull_request:

permissions:
  contents: read

# 同じブランチで新しい実行が始まったら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: バックエンド
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Gradle のキャッシュと、wrapper の検証
      - uses: gradle/actions/setup-gradle@v6

      # 統合テストと jOOQ のコード生成は Testcontainers を使う（ランナーの Docker で動く）
      - name: ビルドとテスト
        run: ./gradlew build

      - name: テストレポートを保存（失敗時）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7

  admin:
    name: 管理画面
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/admin

    steps:
      - uses: actions/checkout@v7

      # pnpm の版は package.json の packageManager に合わせる。依存のストアをキャッシュする
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/admin/package.json
          cache: true
          cache_dependency_path: frontend/admin/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 依存のインストール
        run: pnpm install --frozen-lockfile

      # 型チェックとビルドは、admin.yaml から型を生成してから行う（生成物はコミットしない）
      - name: lint と整形の確認
        run: pnpm lint

      - name: 型チェック
        run: pnpm typecheck

      - name: テスト
        run: pnpm test

      - name: ビルド
        run: pnpm build

  store:
    name: 店舗画面
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/store

    steps:
      - uses: actions/checkout@v7

      # pnpm の版は package.json の packageManager に合わせる。依存のストアをキャッシュする
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/store/package.json
          cache: true
          cache_dependency_path: frontend/store/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 依存のインストール
        run: pnpm install --frozen-lockfile

      # 型チェックとビルドは、store.yaml から型を生成してから行う（生成物はコミットしない）
      - name: lint と整形の確認
        run: pnpm lint

      - name: 型チェック
        run: pnpm typecheck

      - name: テスト
        run: pnpm test

      # 画面はリクエストのたびに作るので、ビルドにバックエンドは要らない
      - name: ビルド
        run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 各部分のジョブが通ってから動かす（失敗の原因を、部分のジョブで先に見つけるため）
    needs: [backend, admin, store]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # pnpm の版は package.json の packageManager に合わせる。依存のストアをキャッシュする
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/e2e/package.json
          cache: true
          cache_dependency_path: frontend/e2e/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 依存のインストール
        run: |
          pnpm --dir frontend/admin install --frozen-lockfile
          pnpm --dir frontend/store install --frozen-lockfile
          pnpm --dir frontend/e2e install --frozen-lockfile

      # バックエンドの local profile の接続先（PostgreSQL）と IdP（Keycloak、realm の JSON を取り込む）、IdP が送るメールの受け手（Mailpit）。
      # compose.yaml をそのまま使う（Keycloak は同じ PostgreSQL の別の database を使うので、GitHub の services ではなく compose で起動する）。
      # IdP の接続先と secret は、バックエンド（application-local.yml）・店舗画面・管理画面の既定の値が、realm の JSON のローカルと CI 用の値と同じなので渡さない（plan 003 第 2.4 節）
      - name: DB・IdP・メールの起動
        run: docker compose up -d --wait postgres keycloak mailpit

      # 画像の置き場所（S3 互換）と変換（imgproxy）。バケット、CORS、公開の設定は、compose の初期化のコンテナで作る（plan 001 第 7 節）
      - name: 画像の置き場所（SeaweedFS）と変換（imgproxy）の起動
        run: |
          docker compose up -d --wait seaweedfs imgproxy
          docker compose run --rm seaweedfs-init

      - name: lint と整形の確認、型チェック
        working-directory: frontend/e2e
        run: pnpm lint && pnpm typecheck

      - name: ブラウザのインストール
        working-directory: frontend/e2e
        run: pnpm exec playwright install --with-deps chromium

      # バックエンド（local profile）、管理画面、店舗画面のビルドと起動は playwright.config.ts が行う
      - name: E2E
        working-directory: frontend/e2e
        run: pnpm test

      - name: Playwright のレポートを保存（失敗時）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 7
