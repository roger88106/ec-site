# Dependabot の設定。手順と理由はブランチとリリースの「Dependabot」。
#
# - 更新の pull request は、既定のブランチ（develop）に対して作成される（target-branch は書かない）。
# - 頻度は週 1 回、月曜の朝（日本時間）。
# - group：minor と patch は ecosystem ごとに 1 つの pull request にまとめる。
#   major は group に入れず、1 つずつ pull request にする（影響を個別に見るため）。
#   例外：github-actions は major も含めて 1 つの pull request にまとめる。
#   github-actions の更新は危険度が高く、利用者が許可するので、許可と CI の待ちを 1 回にするため。
# - cooldown：リリースから待つ日数。major 30、minor 7、patch 3。公開直後のバージョンの不具合や
#   供給網の攻撃を避ける。セキュリティの更新は cooldown を待たずに作成される。
#   github-actions と docker-compose は、GitHub の文書の cooldown の対応表で、
#   SemVer の日数に対応しないため、default-days だけを指定する。
# - label：種類:整理、領域:ci、依存の更新。commit のメッセージの前置きは deps。
# - Dependabot の pull request は、issue が不要で、commit のメッセージは英語でよい（規則の例外）。
# - 注意：Dependabot の pnpm の対応は v10 まで（2026-10-22 の時点）。このリポジトリは pnpm 12 で、
#   npm の更新が失敗したら issue を起票し、Renovate への切り替えを検討する。

version: 2

updates:
  - package-ecosystem: gradle
    directory: /backend/ecsite
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    labels:
      - "種類:整理"
      - "領域:ci"
      - "依存の更新"
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # @types/node の major は、実行の環境（package.json の engines の Node）のバージョンに合わせて手で上げる
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    labels:
      - "種類:整理"
      - "領域:ci"
      - "依存の更新"
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    # `/` は .github/workflows と、ルートの action.yml だけを見る。
    # ローカルの複合の action は、置いてあるディレクトリを追加して見せる。
    directories:
      - /
      - /.github/actions/setup-frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    # major も含めて 1 つの group にする（冒頭の group の例外）
    groups:
      github-actions-all:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    labels:
      - "種類:整理"
      - "領域:ci"
      - "依存の更新"
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      docker-compose-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
    labels:
      - "種類:整理"
      - "領域:ci"
      - "依存の更新"
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5
