# ============================================================================
# main の元のブランチの検査（docs/guides/branches.md 第 3.2 節）
#
# main への pull request は、release- か hotfix- で始まるブランチからだけ受け付ける。
# 理由：release するのは確認した commit で、develop の最新とは限らないため。
# この job の名前は main の ruleset の必須の検査の名前になる。変えるときは ruleset も変える。
# ============================================================================

name: main の元のブランチ

on:
  pull_request:
    # base を main に変えたとき（edited）にも検査する
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-source:
    name: main への元のブランチ
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 元のブランチの名前を確認する
        # ブランチの名前は信頼できない入力なので、run の中に直接展開せず、環境変数を経由する
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release-* | hotfix-*)
              echo "元のブランチ ${HEAD_REF} は main に入れられる。"
              ;;
            *)
              echo "::error::main に入れられるのは release- か hotfix- で始まるブランチだけ。元のブランチ「${HEAD_REF}」は入れられない。"
              exit 1
              ;;
          esac
