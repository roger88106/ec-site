# ============================================================================
# 文書と CI の検査の script（constitution の「CI/CD」）
#
# 文書だけを変えた push でも実行する（ci.yml は文書だけの push では実行しないため、別のワークフローにする）。
# 文書の参照・用語、AC 一覧、対応表、進捗の表などは、
# 文書だけの変更で崩れるので、CI の検査の script の全て（scripts/ci/check-all.sh）と、
# Mermaid の図が描画できるかの検査（scripts/ci/mermaid/mermaid-check.mjs）をここで実行する。
# ============================================================================

name: 文書

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: 文書と CI の検査の script
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          # 全ての branch を取得する。migrations、ja-text の --changed、risk が、origin/develop と origin/main との分岐点を求めるため
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # script のテストと、scripts/ci/ の直下の検査の全て（CI では、テスト名に出ない AC も失敗にする）
      - name: CI の検査の script
        run: scripts/ci/check-all.sh
        env:
          CI: 'true'

      # Mermaid の図が描画できるかの検査。Chrome とネットワークが必要で遅いので、check-all.sh と commit の前の hook では実行せず、ここだけで実行する。
      # Chrome は、ランナーに入っている /usr/bin/google-chrome を script が探す（環境変数 MERMAID_CHROME は不要）。
      # 前の step の失敗とは独立した検査なので、前の step が失敗しても実行し、両方の失敗を 1 回の実行で見えるようにする（中止されたときは実行しない）
      - name: Mermaid の図の描画
        if: ${{ !cancelled() }}
        run: node scripts/ci/mermaid/mermaid-check.mjs
