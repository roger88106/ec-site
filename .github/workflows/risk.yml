# ============================================================================
# 変更の危険度の照合（CI の検査の「CI のジョブ」）
#
# pull request の本文の「## 危険度」の節の値と、scripts/ci/risk.mjs の判定（差分のファイルと spec の宣言から決める）を比べる。
# 本文が判定より低いとき、値が空・節がないときに失敗にする。Dependabot の pull request（作成者で見分ける）は比べず、判定をジョブの要約に出すだけにする。
# 判定は、pull request の側と基準（origin/develop）の側の両方の risk.mjs・risk.json で行い、どちらかが失敗すれば失敗にする（高い方を使う）。
# 経路の一覧や script を変える変更が、変えた後の一覧で自分を危険度が低いと判定するのを防ぐため。基準に risk.mjs がないときは pull request の側だけ。
# pull_request_target にはしない（このワークフローを加える pull request で、必須の検査が流れなくなるため）。
# そのため、このファイルそのものを書き換える変更は防げない（CI の検査の「CI の検査の script」の risk の行）。
# 本文を書き換えたとき（edited）にも流す必要があるので、ci.yml とは別のワークフローにする（edited で全体の CI を流し直さないため）。
# ============================================================================

name: 危険度

on:
  pull_request:
    # 本文を書き換えたとき（edited）と、draft を外したとき（ready_for_review）にも照合する
    # draft の間は、ジョブの条件で照合しない。本文の「## 危険度」の節は draft を外す前に書くので、draft の間は必ず失敗するため
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: risk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  risk:
    name: 危険度の照合
    # 条件で skip したジョブは成功として報告され、必須の検査として通る（draft の pull request はもともとマージできない）
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 判定は、pull request の merge commit と origin/develop の分岐点からの差分で決める（全ての branch と履歴が必要）
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: 本文の危険度と判定を比べる
        # 本文・作成者・題は信頼できない入力なので、run の中に直接展開せず、環境変数を経由する
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        # 出力と基準のバージョンの script は、作業ツリーの外（RUNNER_TEMP）に置く（追跡していないファイルとして差分に入れないため）
        # 基準の側は、基準の scripts/ci/ を取り出して、pull request の作業ツリーで実行する（差分は同じで、経路の一覧と script だけが基準のバージョンになる）
        # 基準の側にも同じ引数を渡すので、引数を変えるときは前のバージョンでも読める形にする
        run: |
          status=0
          base_dir="$RUNNER_TEMP/risk-base"
          printf '%s' "$PR_BODY" | node scripts/ci/risk.mjs --body-file - --author "$PR_AUTHOR" --title "$PR_TITLE" > "$RUNNER_TEMP/risk-head.txt" || status=$?
          if git cat-file -e origin/develop:scripts/ci/risk.mjs 2> /dev/null; then
            mkdir -p "$base_dir"
            git archive origin/develop scripts/ci | tar -x -C "$base_dir"
            printf '%s' "$PR_BODY" | node "$base_dir/scripts/ci/risk.mjs" --skip-path-check --body-file - --author "$PR_AUTHOR" --title "$PR_TITLE" > "$RUNNER_TEMP/risk-base.txt" || status=$?
          else
            echo '基準（origin/develop）に scripts/ci/risk.mjs がないので、pull request の側だけで判定した' > "$RUNNER_TEMP/risk-base.txt"
          fi
          {
            echo '## 危険度'
            echo
            echo '### pull request の側の判定'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/risk-head.txt"
            echo '```'
            echo
            echo '### 基準（origin/develop）の側の判定'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/risk-base.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
