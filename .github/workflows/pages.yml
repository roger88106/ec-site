# ============================================================================
# 機能紹介のページ（showcase/）を GitHub Pages に出す
#
# showcase/ をそのまま出す（ビルドしない）。main で showcase/ が変わったときと、手で起動したときに流す。
# 前提（利用者が設定する）：Settings → Pages の Source が「GitHub Actions」、
#   Settings → Environments → github-pages の Deployment branches に main がある。
# URL：https://roger88106.github.io/ec-site/
# ============================================================================

name: 機能紹介のページ

on:
  push:
    branches: [main]
    paths:
      - 'showcase/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

# 公開は 1 つずつ行い、途中の公開は止めない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 公開
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: showcase

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
