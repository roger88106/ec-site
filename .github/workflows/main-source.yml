# ============================================================================
# main の元のブランチの検査（ブランチとリリースの「main の元のブランチの制限」）
#
# main への pull request は、release- か hotfix- で始まるブランチからだけ受け付ける。
# 理由：リリースするのは確認した commit で、develop の最新とは限らないため。
# この job の名前は main の ruleset の必須の検査の名前になる。変えるときは ruleset も変える。
# ============================================================================

name: main の元のブランチ

on:
  pull_request:
    # base を main に変えたとき（edited）にも検査する
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-source:
    name: main への元のブランチ
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 判定の script を取り出す（pull request の merge commit。script を使うだけで、他のコードは実行しない）
      - uses: actions/checkout@v7

      - name: 元のブランチの名前を確認する
        # ブランチの名前は信頼できない入力なので、run の中に直接展開せず、環境変数を経由する
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/ci/workflow/main-source.mjs "$HEAD_REF"
