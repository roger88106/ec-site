# フロント（管理画面・店舗画面・E2E）の job の共通の準備：pnpm と Node の準備、workspace の依存のインストール
name: フロントの準備
description: pnpm（版はルートの package.json の packageManager）と Node 24 を用意し、workspace の依存を入れる

runs:
  using: composite
  steps:
    # 依存のストアをキャッシュする（キーはルートの pnpm-lock.yaml）
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: package.json
        cache: true
        cache_dependency_path: pnpm-lock.yaml

    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: 依存のインストール
      shell: bash
      run: pnpm install --frozen-lockfile
