# ============================================================================
# 全環境共通の設定
#
# 環境依存の値（DB の接続先、開発用ログレベル等）はここに書かない。
# ローカル開発は application-local.yml、それ以外は環境変数で与える。
#
# すべての値は環境変数で上書きできる（Spring Boot の緩い束縛）。
#   例：spring.datasource.url → SPRING_DATASOURCE_URL、server.port → SERVER_PORT
# ============================================================================

spring:
  application:
    name: ecsite
  web:
    # 対象市場は日本だけなので、メッセージ（入力検証を含む）は常に日本語にする（constitution の「プロジェクトの位置づけ」）。
    # リクエストの Accept-Language や、実行環境の既定のロケールに左右されないよう固定する。
    locale: ja
    locale-resolver: fixed
  modulith:
    # package-info.java に @ApplicationModule を付けたパッケージだけをモジュールとする
    # （common、config、生成コードはモジュールではない）
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        # イベント発行記録のテーブルは common schema に置く（Flyway のマイグレーションで作る）
        schema: common
        schema-initialization:
          enabled: false
      # 再起動時の再発行は使わない。未完了のイベントは定期ジョブ（EventResubmissionJob）が再発行する
      republish-outstanding-events-on-restart: false
      # 最後の試行から結果が出ないまま 5 分たったイベントは、インスタンスが止まったとみなして失敗の状態にする。
      # 再発行のジョブが次の回で再発行するか、処理の回数が上限なら止める
      staleness:
        published: 5m
        processing: 5m
        resubmitted: 5m
        check-interval: 5m
    moments:
      # 時の経過のイベント（Moments）は使わない。有効だと @EnableScheduling を付けるので、
      # 定期ジョブの切り替え（ecsite.scheduling.enabled）を false にしても、定期ジョブが動いてしまう
      enabled: false
  mail:
    properties:
      # SMTP の接続・読み書きの待ち時間の上限（ミリ秒）。上限がないと、応えない SMTP サーバーでメールのリスナーが止まったままになる
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  datasource:
    hikari:
      data-source-properties:
        # 全ての DB の接続の初期化で置くタイムアウトの設定（options）は、設定の型（ecsite.db。DbTimeoutConfig）から作る。
        # マイグレーション（Flyway）はプールを使わない別の接続を使うので、タイムアウトは付かない（FlywayConnectionConfig）。
        # 次の引数は、マイグレーションの別の接続にも、URL に足して付ける（FlywayConnectionConfig）
        # PostgreSQL のエラーの詳細（Key (列)=(値) など、行の値を含む）を、例外のメッセージに入れない。
        # 想定外のエラーのログは原因の例外のメッセージを出すので、入れると行の値がログに残る（制約名は別に取れるので、制約の違反の変換は働く）
        logServerErrorDetail: false
  flyway:
    # マイグレーションはアプリの起動とは分け、デプロイごとに 1 回だけ実行する（バックエンドのアーキテクチャの「水平スケール」）。
    # 起動時の実行は local profile でだけ有効にする。
    enabled: false
  task:
    execution:
      # 外部サービスを呼ばないリスナーのスレッドプール（applicationTaskExecutor）。外部サービスを呼ぶリスナーは別のスレッドプール（ecsite.async.external-service）
      # 別のスレッドプールの Bean があると applicationTaskExecutor が作られなくなるので、force で作らせる
      mode: force
      pool:
        core-size: 8
        max-size: 8
        # キューに上限がないと、処理が追いつかないときにメモリが増え続ける。
        # 満杯で拒否されたイベントは、未完了のまま残り、再発行のジョブが処理する
        queue-capacity: 1000
      shutdown:
        # 停止のとき、処理中のリスナーを待つ。上限は、処理中のリクエストを待つ上限（spring.lifecycle.timeout-per-shutdown-phase）と同じ。
        # 待ちは重なる。処理中のリクエストを最大 30 秒待った後、Bean を壊すときに、2 つのスレッドプール（これと ecsite.async.external-service）が
        # 1 つずつ順に最大 30 秒待つ（Spring Framework は、Bean の破棄で shutdown を呼び、終わりまでブロックする）。
        # コンテキストを閉じる時点で、2 つとも新しいタスクの受付を止め、残りのタスクは並行して動く。停止の最大の合計はおよそ 90 秒
        await-termination: true
        await-termination-period: 30s
    scheduling:
      pool:
        # 定期ジョブの数（6）に合わせる。ジョブが互いを待たないようにする（スレッドが 1 つだと、長いジョブの間、ほかのジョブが始まらない）。
        # ジョブを加えたら、この数も増やす
        size: 6
  lifecycle:
    # graceful shutdown で、処理中のリクエストの完了を待つ上限
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  # 停止時に新しいリクエストの受付を止め、処理中のリクエストを終えてから止める（バックエンドのアーキテクチャの「水平スケール」）
  shutdown: graceful

# ============================== 運用（バックエンドのアーキテクチャの「水平スケール」） ==============================

management:
  server:
    # 運用ポート。死活監視とメトリクスは、業務ポート（server.port）でなくここで出し、外に出さない（バックエンドのアーキテクチャの「公開ネットワークへのデプロイの前提」）
    port: ${MANAGEMENT_SERVER_PORT:9080}
  endpoints:
    web:
      exposure:
        # 死活監視（health）とメトリクスの収集（prometheus）だけを公開する。開発用の追加公開は application-local.yml
        include: health,prometheus
  endpoint:
    health:
      # liveness（/actuator/health/liveness）と readiness（/actuator/health/readiness）を有効にする
      probes:
        enabled: true
      # 外部には UP / DOWN のみ返す（DB などの個別の状態は出さない）
      show-details: never
  tracing:
    sampling:
      # 記録するリクエストの割合。環境に合わせて MANAGEMENT_TRACING_SAMPLING_PROBABILITY で変える
      probability: 0.1
    export:
      zipkin:
        # 送信は既定で無効にする（送信先を持たない）。送るときは MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENABLED を true にし、
        # MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT で送信先を指定する。local の profile は有効にする
        enabled: false

logging:
  structured:
    format:
      # ログは標準出力に JSON で出す（Elastic Common Schema）。トレース ID・span ID も入る
      console: ecs

ecsite:
  async:
    external-service:
      # 外部サービス（メール、ファイル保存、決済、物流）を呼ぶリスナーのスレッドプール。外部が遅いとき、外部を呼ばないリスナーを待たせない。
      # 1 つのインスタンスで、リスナーが外部を同時に呼ぶ数の上限になる（利用者のリクエストと定期ジョブの外部の呼び出しは含まない）
      threads: 4
      # キューに上限がないと、外部が止まったときにメモリが増え続ける。満杯で拒否されたイベントは、未完了のまま残り、再発行のジョブが処理する
      queue-capacity: 1000
  db:
    # DB の接続のタイムアウト（lock-timeout、statement-timeout、idle-in-transaction-timeout）。値と既定値は、設定の型（DbTimeoutConfig）にあり、
    # 1 つずつ環境変数（ECSITE_DB_LOCK_TIMEOUT など）で上書きできる。時間は 1ms 以上で、5s、500ms のように書く
    # ロック待ち（5s）：行ロックと advisory lock を待つ上限を、画面の操作が待てる長さにする。超えると 503（RESOURCE_BUSY）。リスナーは失敗して再発行される
    # 文の実行（30s）：1 つの SQL が終わらないまま、スレッドと接続を使い続けないようにする。超えると 500。
    # 1 文で多くの行を消すような処理は、件数の上限ずつに分ける（処理の済んだイベントの片付けなど）
    # トランザクション中のアイドル（60s）：トランザクションを開いたまま止まった接続のロックを解放する。
    # メールの送信はトランザクションの中で SMTP を呼ぶ。SMTP のタイムアウト（spring.mail.properties）は、接続・読み取り・書き込みの 1 回ごとに各 10 秒で、
    # 1 通の送信の全体の上限ではない（往復が多い）ので、60 秒は目安である。
    # 送信の間に 60 秒を超えると、接続が切断され、トランザクションが失敗する（送信記録のコミットが失敗する）。
    # メールは送られているので、イベントの再発行で送り直されうる
  payment:
    stripe:
      # Stripe の秘密の値。Git に入れず、Stripe の名前の環境変数で渡す（決済サービスが stripe のときだけ使う）
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  shipping:
    # 物流サービスの通知の署名の鍵。Git に入れず、環境変数で渡す（ローカルは application-local.yml の試験用の値）
    webhook-secret: ${CARRIER_WEBHOOK_SECRET:}
  # メールの送信元は環境変数 ECSITE_NOTIFICATION_FROM で、SMTP の接続先は SPRING_MAIL_HOST・SPRING_MAIL_PORT で渡す
  # （ローカルは application-local.yml の Mailpit）
