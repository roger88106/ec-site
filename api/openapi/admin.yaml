openapi: 3.0.3
info:
  title: EC Site 管理 API
  version: 0.1.0
  description: |
    B 側（運営者）向けの API。

    - 認証は MVP では実装しない。各操作に必要な権限を `x-required-permission` に記す（constitution 10）。
    - 同時に編集されうるリソースの更新では、取得時の `version` を送る。一致しなければ 409 を返す。
    - 状態の切り替え（公開・非公開・販売終了、販売停止・解除、注文のキャンセルとその申請の承認）は冪等で、`version` を送らない。すでにその状態なら何もせず 204 を返す。
    - 一覧の並びが同じ値になる場合は、ID で順序を確定させる（MVP の暫定。constitution 9）。
    - 日時は ISO 8601 のオフセット付き文字列。
servers:
  - url: /api/admin
tags:
  - name: tax
    description: 税区分と税率（spec 001 US-1）
  - name: category
    description: カテゴリ（spec 001 US-2）
  - name: product
    description: 商品とバリアント（spec 001 US-3〜6、9）
  - name: inventory
    description: 在庫（spec 001 US-8）
  - name: order
    description: 注文（spec 002 US-19〜21）

paths:
  # ============================== 税 ==============================
  /tax-categories:
    get:
      tags: [tax]
      operationId: listTaxCategories
      summary: 税区分の一覧（税率を含む）
      x-required-permission: tax:read
      responses:
        '200':
          description: 税区分の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxCategoryList'
    post:
      tags: [tax]
      operationId: createTaxCategory
      summary: 税区分の登録（AC-1）
      x-required-permission: tax:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxCategoryRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /tax-categories/{taxCategoryId}:
    parameters:
      - $ref: '#/components/parameters/TaxCategoryId'
    get:
      tags: [tax]
      operationId: getTaxCategory
      summary: 税区分の取得（税率を含む）
      x-required-permission: tax:read
      responses:
        '200':
          description: 税区分
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxCategory'
        '404':
          $ref: '#/components/responses/NotFound'

  /tax-categories/{taxCategoryId}/rates:
    parameters:
      - $ref: '#/components/parameters/TaxCategoryId'
    put:
      tags: [tax]
      operationId: replaceTaxRates
      summary: 税率の一覧を置き換える（AC-2〜5、7）
      description: |
        税区分の税率を一覧ごと置き換える。既存の税率を残す場合は `id` を指定する。
        `id` のない要素は新しい税率として扱い、送られなかった既存の税率は削除として扱う。
      x-required-permission: tax:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceTaxRatesRequest'
      responses:
        '204':
          description: 置き換えた
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ============================== カテゴリ ==============================
  /categories:
    get:
      tags: [category]
      operationId: listCategories
      summary: カテゴリの木
      x-required-permission: category:read
      responses:
        '200':
          description: 最上位カテゴリの一覧（子孫を含む）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryTree'
    post:
      tags: [category]
      operationId: createCategory
      summary: カテゴリの登録（AC-8〜10）
      x-required-permission: category:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /categories/order:
    put:
      tags: [category]
      operationId: reorderCategories
      summary: 兄弟カテゴリの並び順を変更する（AC-11）
      description: 同じ親を持つカテゴリを、並べたい順にすべて送る。
      x-required-permission: category:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderCategoriesRequest'
      responses:
        '204':
          description: 変更した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      tags: [category]
      operationId: getCategory
      summary: カテゴリの取得
      x-required-permission: category:read
      responses:
        '200':
          description: カテゴリ（子カテゴリは含まない）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [category]
      operationId: renameCategory
      summary: カテゴリ名の変更（AC-10、11）
      x-required-permission: category:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameCategoryRequest'
      responses:
        '204':
          description: 変更した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [category]
      operationId: deleteCategory
      summary: カテゴリの削除（AC-12）
      description: 子カテゴリを持つ、または商品が所属しているカテゴリは削除できない（400）。
      x-required-permission: category:write
      responses:
        '204':
          description: 削除した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================== 商品 ==============================
  /products:
    get:
      tags: [product]
      operationId: listProducts
      summary: 商品の一覧・絞り込み（AC-47〜50）
      description: 状態に関係なく、すべての商品が対象。並びは登録日時の新しい順（同じなら ID 順）。
      x-required-permission: product:read
      parameters:
        - name: code
          in: query
          description: 商品品番またはバリアント品番の前方一致（英小文字は大文字として扱う）
          schema:
            type: string
            maxLength: 32
        - name: name
          in: query
          description: 商品名の部分一致
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PublicationStatus'
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 商品の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [product]
      operationId: createProduct
      summary: 商品の登録（AC-6、13〜17、25）
      x-required-permission: product:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [product]
      operationId: getProduct
      summary: 商品の詳細（バリアントを含む）
      x-required-permission: product:read
      responses:
        '200':
          description: 商品の詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [product]
      operationId: updateProduct
      summary: 商品の編集（AC-6、18、19、25、26）
      x-required-permission: product:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '204':
          description: 変更した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [product]
      operationId: deleteProduct
      summary: 商品の削除（AC-33）
      description: C 側に一度でも表示された商品は削除できない（400）。
      x-required-permission: product:write
      parameters:
        - $ref: '#/components/parameters/Version'
      responses:
        '204':
          description: 削除した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{productId}/publish:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    put:
      tags: [product]
      operationId: publishProduct
      summary: 公開する（AC-29、31）
      description: 冪等。すでに公開なら何もしない。バリアントのない商品、販売終了の商品は 400。
      x-required-permission: product:write
      responses:
        '204':
          description: 公開した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{productId}/unpublish:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    put:
      tags: [product]
      operationId: unpublishProduct
      summary: 非公開にする（AC-30）
      description: 冪等。すでに非公開なら何もしない。販売終了の商品は 400。
      x-required-permission: product:write
      responses:
        '204':
          description: 非公開にした
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{productId}/discontinue:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    put:
      tags: [product]
      operationId: discontinueProduct
      summary: 販売終了にする（AC-32）
      description: 冪等。すでに販売終了なら何もしない。
      x-required-permission: product:write
      responses:
        '204':
          description: 販売終了にした
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{productId}/publication-period:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    put:
      tags: [product]
      operationId: setPublicationPeriod
      summary: 公開期間の設定（AC-34〜36、P2）
      x-required-permission: product:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPublicationPeriodRequest'
      responses:
        '204':
          description: 設定した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ============================== バリアント ==============================
  /products/{productId}/variants:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      tags: [product]
      operationId: addVariant
      summary: バリアントの登録（AC-20〜24）
      description: バリアントは商品の一部で単独の URL を持たないため、`Location` は返さず、本文で ID を返す。
      x-required-permission: product:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddVariantRequest'
      responses:
        '201':
          description: 登録した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{productId}/variants/order:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    put:
      tags: [product]
      operationId: reorderVariants
      summary: バリアントの表示順を変更する（AC-27）
      description: 商品のすべてのバリアントを、並べたい順に送る。
      x-required-permission: product:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderVariantsRequest'
      responses:
        '204':
          description: 変更した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{productId}/variants/{variantId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/VariantId'
    delete:
      tags: [product]
      operationId: deleteVariant
      summary: バリアントの削除（AC-71）
      description: C 側に一度でも表示された商品のバリアントは削除できない（400）。
      x-required-permission: product:write
      parameters:
        - $ref: '#/components/parameters/Version'
      responses:
        '204':
          description: 削除した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{productId}/variants/{variantId}/suspend:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/VariantId'
    put:
      tags: [product]
      operationId: suspendVariant
      summary: バリアントを販売停止にする（AC-28、P2）
      description: 冪等。すでに販売停止なら何もしない。
      x-required-permission: product:write
      responses:
        '204':
          description: 販売停止にした
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{productId}/variants/{variantId}/resume:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/VariantId'
    put:
      tags: [product]
      operationId: resumeVariant
      summary: バリアントの販売停止を解除する（AC-28、P2）
      description: 冪等。販売停止でなければ何もしない。
      x-required-permission: product:write
      responses:
        '204':
          description: 解除した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ============================== 商品画像 ==============================
  /products/{productId}/image-uploads:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      tags: [product]
      operationId: createImageUpload
      summary: 画像のアップロードを受け付ける（AC-39、40、67、P2）
      description: |
        形式・サイズ・枚数を確かめ、受付のバケットへの署名付き URL（PUT）を返す（plan 001 第 7 節）。
        ブラウザは `uploadUrl` に `headers` を付けてファイルを PUT し、その後 `POST /products/{productId}/images` で登録する。
        受付だけで登録しなかったファイルは、1 日で消える。
      x-required-permission: product:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImageUploadRequest'
      responses:
        '201':
          description: 受け付けた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /products/{productId}/images:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      tags: [product]
      operationId: addProductImage
      summary: 受け付けた画像を登録する（AC-37、39、40、67〜70、P2）
      description: |
        受付のファイルの大きさと形式（先頭のバイト）を確かめ、WebP に変換して（メタデータを除く）配信のバケットへ置き、商品の画像の最後に加える（plan 001 第 7.5 節）。
        変換に失敗した画像は登録せず、400（`IMAGE_CONVERSION_FAILED`）を返す（AC-70）。
        バリアントと同じく商品の一部で単独の URL を持たないため、`Location` は返さず、本文で ID を返す。
      x-required-permission: product:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProductImageRequest'
      responses:
        '201':
          description: 登録した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{productId}/images/order:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    put:
      tags: [product]
      operationId: reorderProductImages
      summary: 画像の並び順の変更（AC-37、P2）
      description: 商品のすべての画像の ID を、並べたい順に送る。過不足があれば 400。先頭が代表画像。
      x-required-permission: product:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderProductImagesRequest'
      responses:
        '204':
          description: 並び替えた
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{productId}/images/{imageId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/ImageId'
    delete:
      tags: [product]
      operationId: deleteProductImage
      summary: 画像の削除（AC-37、P2）
      description: その画像を指定していたバリアントの指定は外れる。配信のファイルは、削除の後に消える。
      x-required-permission: product:write
      parameters:
        - $ref: '#/components/parameters/Version'
      responses:
        '204':
          description: 削除した
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /products/{productId}/variants/{variantId}/image:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/VariantId'
    put:
      tags: [product]
      operationId: setVariantImage
      summary: バリアントの画像の指定（AC-38、P2）
      description: その商品の画像を 1 枚指定する。`imageId` を null にすると指定を外す（代表画像を使う）。
      x-required-permission: product:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetVariantImageRequest'
      responses:
        '204':
          description: 指定した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ============================== 在庫 ==============================
  /inventory/variants/{variantId}:
    parameters:
      - $ref: '#/components/parameters/VariantId'
    get:
      tags: [inventory]
      operationId: getStock
      summary: バリアントの在庫数
      x-required-permission: inventory:read
      responses:
        '200':
          description: 在庫数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/variants/{variantId}/adjustments:
    parameters:
      - $ref: '#/components/parameters/VariantId'
    post:
      tags: [inventory]
      operationId: adjustStock
      summary: 在庫の調整（AC-42〜44、46）
      description: 在庫調整は履歴の 1 件で単独の URL を持たないため、`Location` は返さず、本文で結果を返す。
      x-required-permission: inventory:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustStockRequest'
      responses:
        '201':
          description: 調整した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockAdjustment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [inventory]
      operationId: listStockAdjustments
      summary: 在庫調整の履歴（AC-45）
      description: 新しい順。
      x-required-permission: inventory:read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 履歴
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockAdjustmentPage'
        '404':
          $ref: '#/components/responses/NotFound'

  /inventory/stock-summaries:
    get:
      tags: [inventory]
      operationId: listStockSummaries
      summary: 商品ごとの在庫数の合計（AC-49）
      x-required-permission: inventory:read
      parameters:
        - name: productIds
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: 在庫数の合計。在庫がまだない商品は 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockSummaryList'
        '400':
          $ref: '#/components/responses/BadRequest'


  # ============================== 注文 ==============================
  /orders:
    get:
      tags: [order]
      operationId: listOrders
      summary: 注文一覧（AC-97〜99、106）
      description: 注文日時の新しい順。キャンセル済みの注文も含む。
      x-required-permission: order:read
      parameters:
        - name: orderNumber
          in: query
          description: 注文番号の前方一致
          schema:
            type: string
            maxLength: 15
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: orderedFrom
          in: query
          description: 注文日の範囲の開始（日本時間の日付。この日を含む）
          schema:
            type: string
            format: date
        - name: orderedTo
          in: query
          description: 注文日の範囲の終了（日本時間の日付。この日を含む）
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 注文一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [order]
      operationId: getOrder
      summary: 注文の詳細（AC-100、106）
      x-required-permission: order:read
      responses:
        '200':
          description: 注文の詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/cancellation-request/approve:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    put:
      tags: [order]
      operationId: approveOrderCancellation
      summary: キャンセルの申請の承認（AC-101、104、105）
      description: |
        キャンセルにし、同じトランザクションで明細の数量だけ在庫数を戻す。キャンセル済みなら何もせず 204（冪等）。
        申請中でない「受付」の注文は 400。
      x-required-permission: order:write
      responses:
        '204':
          description: 承認した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/cancellation-request/reject:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    put:
      tags: [order]
      operationId: rejectOrderCancellation
      summary: キャンセルの申請の却下（AC-102、105）
      description: 「受付」に戻す。申請中でない注文（キャンセル済みを含む）は 400。
      x-required-permission: order:write
      responses:
        '204':
          description: 却下した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    put:
      tags: [order]
      operationId: cancelOrder
      summary: 運営者の判断によるキャンセル（AC-103〜105）
      description: 「受付」「キャンセル申請中」の注文をキャンセルにし、在庫数を戻す。キャンセル済みなら何もせず 204（冪等。理由は変えない）。
      x-required-permission: order:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '204':
          description: キャンセルした
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    TaxCategoryId:
      name: taxCategoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImageId:
      name: imageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Version:
      name: version
      in: query
      required: true
      description: 取得時のバージョン（楽観ロック）
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      description: ページ番号（1 始まり）
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      description: 1 ページの件数
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Created:
      description: 登録した
      headers:
        Location:
          description: 登録したリソースの URL
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatedId'
    BadRequest:
      description: 入力の誤り、または業務ルール違反
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 見つからない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 一意性の違反、または他の人が先に更新した（バージョン不一致）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ---------- 共通 ----------
    Problem:
      type: object
      description: エラー（RFC 9457 に項目を追加したもの。constitution 9）
      required: [status, errorCode, message, traceId]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        errorCode:
          type: string
          description: フロントが分岐に使うコード
          example: PRODUCT_CODE_ALREADY_EXISTS
        message:
          type: string
          description: 画面にそのまま出せるメッセージ
          example: 商品品番 ABC-001 はすでに使われています。
        traceId:
          type: string
        errors:
          type: array
          description: 入力検証エラーのときだけ
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    PageMeta:
      type: object
      required: [page, size, totalItems, totalPages]
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    CreatedId:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    Version:
      type: integer
      format: int64
      description: 取得時のバージョン（楽観ロック）

    # ---------- 税 ----------
    TaxCategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaxCategory'
    TaxCategory:
      type: object
      required: [id, name, rates, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currentRatePercent:
          type: number
          nullable: true
          description: 現時点で有効な率。なければ null
        rates:
          type: array
          description: 適用期間の古い順
          items:
            $ref: '#/components/schemas/TaxRate'
        version:
          $ref: '#/components/schemas/Version'
    TaxRate:
      type: object
      required: [id, ratePercent]
      properties:
        id:
          type: string
          format: uuid
        ratePercent:
          $ref: '#/components/schemas/RatePercent'
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
          description: 適用開始日時。null は過去すべて
        effectiveTo:
          type: string
          format: date-time
          nullable: true
          description: 適用終了日時（この日時を含まない）。null は無期限
    RatePercent:
      type: number
      minimum: 0
      maximum: 100
      exclusiveMaximum: true
      description: 率（%）。小数第 2 位まで
      example: 10
    CreateTaxCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
    ReplaceTaxRatesRequest:
      type: object
      required: [version, rates]
      properties:
        version:
          $ref: '#/components/schemas/Version'
        rates:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TaxRateDraft'
    TaxRateDraft:
      type: object
      required: [ratePercent]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: 既存の税率を残す場合に指定する。null は新しい税率
        ratePercent:
          $ref: '#/components/schemas/RatePercent'
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
        effectiveTo:
          type: string
          format: date-time
          nullable: true

    # ---------- カテゴリ ----------
    CategoryTree:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
    CategoryNode:
      type: object
      required: [id, name, depth, displayOrder, version, children]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        depth:
          type: integer
          format: int32
          minimum: 1
          maximum: 3
        displayOrder:
          type: integer
          format: int32
        version:
          $ref: '#/components/schemas/Version'
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
    Category:
      type: object
      required: [id, name, depth, displayOrder, version]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
          description: null は最上位
        name:
          type: string
        depth:
          type: integer
          format: int32
          minimum: 1
          maximum: 3
        displayOrder:
          type: integer
          format: int32
        version:
          $ref: '#/components/schemas/Version'
    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        parentId:
          type: string
          format: uuid
          nullable: true
          description: null は最上位
    RenameCategoryRequest:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        version:
          $ref: '#/components/schemas/Version'
    ReorderCategoriesRequest:
      type: object
      required: [categoryIds]
      properties:
        parentId:
          type: string
          format: uuid
          nullable: true
          description: null は最上位のカテゴリを並べ替える
        categoryIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid

    # ---------- 商品 ----------
    PublicationStatus:
      type: string
      enum: [UNPUBLISHED, PUBLISHED, DISCONTINUED]
      description: 非公開、公開、販売終了
    ProductCode:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[A-Z0-9]+(-[A-Z0-9]+)*$'
      description: 商品品番。半角の英大文字・数字とハイフンで 1〜32 文字。ハイフンは英数字の間にだけ置ける（AC-15）
      example: ABC-001
    VariantCode:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[A-Z0-9]+(-[A-Z0-9]+)*$'
      description: バリアント品番。形式は商品品番と同じ（AC-21）
      example: ABC-001-WH-M
    ProductSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ProductSummary'
    ProductSummary:
      type: object
      description: 在庫数の合計は在庫の API（stock-summaries）で取得する
      required: [id, productCode, name, status, variantCount]
      properties:
        id:
          type: string
          format: uuid
        productCode:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/PublicationStatus'
        variantCount:
          type: integer
          format: int32
    ProductDetail:
      type: object
      required: [id, productCode, name, description, taxCategoryId, priceExclTax, priceInclTax, categoryIds, axes, status, images, variants, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        productCode:
          type: string
        name:
          type: string
        description:
          type: string
        taxCategoryId:
          type: string
          format: uuid
        priceExclTax:
          type: integer
          format: int64
          description: 税抜価格（円）。全バリアント共通
        priceInclTax:
          type: integer
          format: int64
          nullable: true
          description: 現時点の税込価格（円）。有効な税率がなければ null
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
        axes:
          type: array
          description: バリアント軸の名前（並び順どおり）
          maxItems: 3
          items:
            type: string
        status:
          $ref: '#/components/schemas/PublicationStatus'
        firstShownAt:
          type: string
          format: date-time
          nullable: true
          description: 初回表示日時。未来の値は表示予定。null または未来なら、C 側に一度も表示されていない
        publishStart:
          type: string
          format: date-time
          nullable: true
        publishEnd:
          type: string
          format: date-time
          nullable: true
        images:
          type: array
          description: 表示順。先頭が代表画像（AC-37）
          items:
            $ref: '#/components/schemas/ProductImage'
        variants:
          type: array
          description: 表示順
          items:
            $ref: '#/components/schemas/Variant'
        version:
          $ref: '#/components/schemas/Version'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Variant:
      type: object
      required: [id, variantCode, axisValues, salesSuspended]
      properties:
        id:
          type: string
          format: uuid
        variantCode:
          type: string
        axisValues:
          type: array
          description: 軸の値（商品の axes と同じ並び）
          items:
            type: string
        salesSuspended:
          type: boolean
        imageId:
          type: string
          format: uuid
          nullable: true
          description: バリアントに指定した画像（AC-38）。なければ代表画像を使う
    ProductImage:
      type: object
      required: [id, url]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: 配信の URL
    CreateImageUploadRequest:
      type: object
      required: [contentType, contentLength]
      properties:
        contentType:
          type: string
          description: ファイルの形式。image/jpeg、image/png、image/webp、image/bmp、image/heic、image/heif、image/avif（AC-39、67）
          example: image/jpeg
        contentLength:
          type: integer
          format: int64
          description: ファイルの大きさ（バイト）。10MB（10,485,760）まで（AC-39）
    ImageUpload:
      type: object
      required: [uploadId, uploadUrl, headers, expiresAt]
      properties:
        uploadId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          description: ファイルを PUT する署名付き URL
        headers:
          type: object
          description: PUT に付けるヘッダー
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
          description: 署名付き URL の期限
    AddProductImageRequest:
      type: object
      required: [uploadId, version]
      properties:
        uploadId:
          type: string
          format: uuid
        version:
          $ref: '#/components/schemas/Version'
    ReorderProductImagesRequest:
      type: object
      required: [imageIds, version]
      properties:
        imageIds:
          type: array
          description: 並べたい順の画像 ID（すべて）
          uniqueItems: true
          items:
            type: string
            format: uuid
        version:
          $ref: '#/components/schemas/Version'
    SetVariantImageRequest:
      type: object
      required: [version]
      properties:
        imageId:
          type: string
          format: uuid
          nullable: true
          description: その商品の画像。null で指定を外す
        version:
          $ref: '#/components/schemas/Version'
    CreateProductRequest:
      type: object
      required: [productCode, name, description, taxCategoryId, priceExclTax]
      properties:
        productCode:
          $ref: '#/components/schemas/ProductCode'
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        taxCategoryId:
          type: string
          format: uuid
        priceExclTax:
          type: integer
          format: int64
          minimum: 1
          description: 税抜価格（円）。全バリアント共通
        categoryIds:
          type: array
          uniqueItems: true
          default: []
          items:
            type: string
            format: uuid
        axes:
          type: array
          maxItems: 3
          uniqueItems: true
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 30
    UpdateProductRequest:
      type: object
      description: 商品品番とバリアント軸は変更できない
      required: [name, description, taxCategoryId, priceExclTax, categoryIds, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        taxCategoryId:
          type: string
          format: uuid
        priceExclTax:
          type: integer
          format: int64
          minimum: 1
          description: 税抜価格（円）。全バリアント共通
        categoryIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        version:
          $ref: '#/components/schemas/Version'
    SetPublicationPeriodRequest:
      type: object
      required: [version]
      properties:
        publishStart:
          type: string
          format: date-time
          nullable: true
        publishEnd:
          type: string
          format: date-time
          nullable: true
        version:
          $ref: '#/components/schemas/Version'
    AddVariantRequest:
      type: object
      required: [variantCode, axisValues, version]
      properties:
        variantCode:
          $ref: '#/components/schemas/VariantCode'
        axisValues:
          type: array
          description: 軸の値（商品の axes と同じ並び。軸がない商品は空）
          maxItems: 3
          items:
            type: string
            minLength: 1
            maxLength: 50
        version:
          $ref: '#/components/schemas/Version'
    ReorderVariantsRequest:
      type: object
      required: [variantIds, version]
      properties:
        variantIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        version:
          $ref: '#/components/schemas/Version'

    # ---------- 在庫 ----------
    Stock:
      type: object
      required: [variantId, quantity]
      properties:
        variantId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 0
    StockAdjustmentReason:
      type: string
      enum: [ARRIVAL, STOCKTAKE, DAMAGE_OR_LOSS, OTHER]
      description: 入荷、棚卸差異、破損・紛失、その他
    AdjustStockRequest:
      type: object
      required: [delta, reason]
      properties:
        delta:
          type: integer
          format: int32
          description: 増減量。0 は不可
        reason:
          $ref: '#/components/schemas/StockAdjustmentReason'
        memo:
          type: string
          nullable: true
          maxLength: 500
          description: 理由が OTHER のときは必須
    StockAdjustment:
      type: object
      required: [id, delta, reason, quantityAfter, adjustedAt]
      properties:
        id:
          type: string
          format: uuid
        delta:
          type: integer
          format: int32
        reason:
          $ref: '#/components/schemas/StockAdjustmentReason'
        memo:
          type: string
          nullable: true
        quantityAfter:
          type: integer
          format: int32
          description: 調整後の在庫数
        adjustedAt:
          type: string
          format: date-time
    StockAdjustmentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/StockAdjustment'
    StockSummaryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StockSummary'
    StockSummary:
      type: object
      required: [productId, totalQuantity]
      properties:
        productId:
          type: string
          format: uuid
        totalQuantity:
          type: integer
          format: int64

    # ---------- 注文（spec 002） ----------
    OrderStatus:
      type: string
      enum: [ACCEPTED, CANCELLATION_REQUESTED, CANCELLED]
      description: 受付、キャンセル申請中、キャンセル（BR-9）
    OrderSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderSummary'
    OrderSummary:
      type: object
      required: [id, orderNumber, orderedAt, customerName, total, status]
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
        orderedAt:
          type: string
          format: date-time
        customerName:
          type: string
          description: お届け先の氏名
        total:
          type: integer
          format: int64
          description: 総額（円）
        status:
          $ref: '#/components/schemas/OrderStatus'
    OrderDetail:
      type: object
      required: [id, orderNumber, orderedAt, status, lines, amounts, email, shippingAddress]
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
        orderedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/OrderStatus'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        amounts:
          $ref: '#/components/schemas/OrderAmounts'
        email:
          type: string
        shippingAddress:
          $ref: '#/components/schemas/ShippingAddress'
        cancellationRequest:
          $ref: '#/components/schemas/CancellationRequest'
        cancellation:
          $ref: '#/components/schemas/Cancellation'
    OrderLine:
      type: object
      description: 注文時点の写し（AC-92）
      required: [variantId, productCode, variantCode, productName, axisValues, unitPriceExclTax, unitPriceInclTax, ratePercent, quantity, subtotal]
      properties:
        variantId:
          type: string
          format: uuid
          description: 在庫の参照用。表示には品番の写しを使う
        productCode:
          type: string
        variantCode:
          type: string
        productName:
          type: string
        axisValues:
          type: array
          items:
            $ref: '#/components/schemas/OrderAxisValue'
        unitPriceExclTax:
          type: integer
          format: int64
        unitPriceInclTax:
          type: integer
          format: int64
        ratePercent:
          $ref: '#/components/schemas/RatePercent'
        quantity:
          type: integer
          format: int32
        subtotal:
          type: integer
          format: int64
    OrderAxisValue:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
    OrderAmounts:
      type: object
      description: 金額の内訳（BR-7、8）
      required: [itemsTotal, shippingFee, total, taxes]
      properties:
        itemsTotal:
          type: integer
          format: int64
        shippingFee:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        taxes:
          type: array
          description: 税率ごとの消費税額（税率の高い順）
          items:
            $ref: '#/components/schemas/OrderTaxAmount'
    OrderTaxAmount:
      type: object
      required: [ratePercent, taxableAmount, taxAmount]
      properties:
        ratePercent:
          $ref: '#/components/schemas/RatePercent'
        taxableAmount:
          type: integer
          format: int64
        taxAmount:
          type: integer
          format: int64
    ShippingAddress:
      type: object
      required: [name, postalCode, prefecture, address, phone]
      properties:
        name:
          type: string
        postalCode:
          type: string
        prefecture:
          type: string
        address:
          type: string
        phone:
          type: string
    CancellationRequest:
      type: object
      description: 消費者によるキャンセルの申請。なければ省く
      required: [requestedAt, result]
      properties:
        requestedAt:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
        result:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
          description: 申請中、承認、却下
        decidedAt:
          type: string
          format: date-time
          nullable: true
          description: 承認・却下した日時
    Cancellation:
      type: object
      description: キャンセルした内容。キャンセルでなければ省く
      required: [cancelledAt, byOperator]
      properties:
        cancelledAt:
          type: string
          format: date-time
        byOperator:
          type: boolean
          description: 運営者の判断によるキャンセル（申請の承認でない）
        reason:
          type: string
          nullable: true
          description: 運営者の判断によるキャンセルの理由
    CancelOrderRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: キャンセルの理由（必須）
