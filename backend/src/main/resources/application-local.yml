# ============================================================================
# ローカル開発用の設定
#
# 有効化：起動時に spring.profiles.active=local を指定する
#   - IntelliJ：実行構成 → Active profiles に local
#   - Gradle  ：./gradlew bootRun --args='--spring.profiles.active=local'
#
# 接続先はリポジトリのルートの compose.yaml に合わせている。
# ============================================================================

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ec_site
    username: ec_site
    password: ec_site
  flyway:
    # ローカルでは起動時にマイグレーションを適用する
    enabled: true
    # ローカル用の seed も適用する（db/seed/local/README.md）
    locations: classpath:db/migration,classpath:db/seed/local

logging:
  structured:
    format:
      # ローカルでは読みやすさを優先して、JSON ではなく通常のテキストで出す（トレース ID は行に入る）
      console: ""
  level:
    com.ecsite: DEBUG
    # SQL とバインドパラメータ
    org.jooq.tools.LoggerListener: DEBUG

management:
  endpoints:
    web:
      exposure:
        # 開発用：Bean 一覧 / 自動構成の判定結果 / 環境変数 / マッピング一覧 / モジュール構成
        include: health,prometheus,beans,conditions,env,mappings,modulith
  endpoint:
    health:
      # 開発中は DB などの個別の状態も見たい
      show-details: always
  tracing:
    sampling:
      # ローカルでは全リクエストを記録し、compose の Zipkin（http://localhost:9411）で見る
      probability: 1.0

ecsite:
  media:
    storage:
      # compose の SeaweedFS（S3 互換）。バケットは compose の seaweedfs-init が作る（plan 001 第 7 節）
      endpoint: http://localhost:8333
      region: us-east-1
      path-style-access: true
      # compose/seaweedfs/s3.json のローカル専用の資格情報。本番は設定せず、IAM ロールを使う
      access-key-id: ec-site-local
      secret-access-key: ec-site-local-secret
      incoming-bucket: ec-site-images-incoming
      public-bucket: ec-site-images
      public-base-url: http://localhost:8333/ec-site-images
