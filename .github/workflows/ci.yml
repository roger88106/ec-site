# ============================================================================
# CI（constitution 12）
#
# push と pull request で実行する。CI が失敗している状態で、次の spec の実装に進まない。
# ジョブの一覧、手元で同じ検査を流すコマンド、CI の検査の script の中身は docs/guides/ci.md。
# ============================================================================

name: CI

on:
  # CI の結果に関わらないファイルだけを変えた push では流さない（constitution 12）。
  # 1 つでも他のファイルが含まれていれば、すべての job を流す。
  # paths は上から順に当てる（! で除いたものも、後の行で再度含められる）
  push:
    paths:
      - '**'
      - '!**.md'          # 文書、skill の本文
      - '!.claude/**'     # エージェントの設定と、ローカルの画面の確認の設定
      - '!scripts/dev/**' # ローカル用の script（CI で使う script は scripts/ci/ に置く。E2E の script から使う scripts/dev/lib/ は次の行で含め直す）
      - 'scripts/dev/lib/**' # CI の E2E の script から使う script の置き場所
      - '!showcase/**'    # 機能紹介のページ（pages.yml で公開する）
      - '!.github/workflows/pages.yml'
      - '!.gitignore'
      - '!LICENSE'
      - 'docs/design/overview.md' # 全体構成の文書。バックエンドの単体テスト（ModuleDiagramTest）が図と照合する
  # pull request は、変えたファイルによらずいつも流す（develop と main に入る前に必ず確認する）
  pull_request:

permissions:
  contents: read

# 同じブランチで新しい実行が始まったら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # バックエンドは 4 つのジョブに分ける。統合テストが全体の約 3 分の 2 を占めるので、2 つに分けて同時に流す。
  # 3 つのジョブは同時に始まり、それぞれコンパイルする（結果を渡すと、統合テストがビルドを待って全体が長くなる）。
  # 変わっていない部分（jOOQ のコード、コンパイル）は、setup-gradle が develop のビルドのキャッシュから読む。
  # 手元は分けずに ./gradlew checkLicense build で全て流す（docs/guides/ci.md）。
  backend-build:
    name: バックエンド（ビルドと単体テスト）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/ecsite

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Gradle のキャッシュと、wrapper の検証
      - uses: gradle/actions/setup-gradle@v6

      # 依存のライセンスを、方針（scripts/ci/licenses/policy.json）と照合する（依存とライセンス）。
      # 別の手順にすると Gradle の起動と依存の解決が 2 回になり、1 分ほど延びるので、ビルドと同じ呼び出しで流す。
      # 失敗したときは、ログの「Some library licenses are not allowed」と build/reports/dependency-license/ を見る。
      # 統合テストは別のジョブで流す。カバレッジの報告も、合わせるジョブ（backend）で作る。
      # jOOQ のコード生成は Testcontainers を使う（ランナーの Docker で動く）
      - name: ライセンスの検査、ビルドと単体テスト
        run: ./gradlew checkLicense build -x integrationTest -x coverageReport

      # 合わせるジョブ（backend）が、コンパイルなしでカバレッジの報告を作るために使う。
      # クラスは、各ジョブが別々にコンパイルしたものと中身が同じ（JaCoCo のクラスの ID が一致する）
      - name: カバレッジの実行データ（単体テスト）を保存
        uses: actions/upload-artifact@v7
        with:
          name: backend-exec-unit
          path: backend/ecsite/build/jacoco/test.exec
          if-no-files-found: error
          retention-days: 1

      - name: コンパイルしたクラスを保存
        uses: actions/upload-artifact@v7
        with:
          name: backend-classes
          path: backend/ecsite/build/classes/java/main/
          if-no-files-found: error
          retention-days: 1

      - name: テストレポートを保存（失敗時）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-build
          path: |
            backend/ecsite/build/reports/tests/
            backend/ecsite/build/test-results/
            backend/ecsite/build/reports/dependency-license/dependencies-without-allowed-license.json
          retention-days: 7

  # 統合テストをテストクラスの名前で 2 つに分け、2 つのジョブで同時に流す（分け方は build.gradle.kts の integrationTestShards）。
  # 片方が失敗しても、もう片方は最後まで流す（失敗の全体を一度に見るため）
  backend-integration:
    name: バックエンド（統合テスト ${{ matrix.shard }}/2）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: backend/ecsite

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # 統合テストに必要な task だけが流れる（ライセンスの検査と Checkstyle は、ビルドと単体テストのジョブで流す）。
      # 統合テストと jOOQ のコード生成は Testcontainers を使う（ランナーの Docker で動く）
      - name: 統合テスト（${{ matrix.shard }}/2）
        run: ./gradlew integrationTest -PintegrationTestShard=${{ matrix.shard }}/2

      - name: カバレッジの実行データ（統合テスト）を保存
        uses: actions/upload-artifact@v7
        with:
          name: backend-exec-integration-${{ matrix.shard }}
          path: backend/ecsite/build/jacoco/integrationTest.exec
          if-no-files-found: error
          retention-days: 1

      - name: テストレポートを保存（失敗時）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-integration-${{ matrix.shard }}
          path: |
            backend/ecsite/build/reports/tests/
            backend/ecsite/build/test-results/
          retention-days: 7

  # ruleset の必須の検査の名前は「バックエンド」なので、この名前を残す（変えると ruleset の変更が要る）。
  # 上の 3 つのジョブの後に、カバレッジの実行データを合わせて報告を作る。
  # 上のジョブが失敗・スキップしたときも、このジョブを実行して失敗にする。
  # needs のジョブが失敗するとこのジョブはスキップされ、必須の検査としては成功と同じに扱われるので、
  # if で必ず実行し、最初の手順で結果を調べる。
  # always() でなく !cancelled() にするのは、ワークフローが中止されたとき（concurrency の cancel-in-progress）に、
  # このジョブも中止にするため（古い commit に失敗を残さない）。中止も成功ではないので、必須の検査としては通らない
  backend:
    name: バックエンド
    needs: [backend-build, backend-integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/ecsite

    steps:
      # checkout の前に走るので、defaults の working-directory（まだ存在しない）を使わない
      - name: ビルドと単体テスト、統合テストの結果を確認
        working-directory: .
        env:
          BUILD_RESULT: ${{ needs.backend-build.result }}
          INTEGRATION_RESULT: ${{ needs.backend-integration.result }}
        run: |
          echo "ビルドと単体テスト: $BUILD_RESULT"
          echo "統合テスト: $INTEGRATION_RESULT"
          if [ "$BUILD_RESULT" != "success" ] || [ "$INTEGRATION_RESULT" != "success" ]; then
            echo "::error::成功しなかったジョブがある。それぞれのジョブのログを見る"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 報告を作る Gradle の呼び出しだけに使う（テストもコンパイルも流さない）
      - uses: gradle/actions/setup-gradle@v6

      - name: 実行データとクラスを取得
        uses: actions/download-artifact@v8
        with:
          pattern: backend-*
          path: ${{ runner.temp }}/backend

      # カバレッジ（テストの書き方 第 1 節）。基準の検査は、報告を保存した後の最後の手順で行う。
      # 実行データ（単体 1 つと統合 2 つ）を 1 つの報告にする。クラスは、ビルドのジョブがコンパイルしたもの
      # JaCoCo は、実行データとクラスが一致しないと警告を出す（各ジョブが別々にコンパイルしたクラスが違うとき）。
      # 失敗にはせず、注釈に出す。pipefail で Gradle の失敗は隠さない
      - name: カバレッジの報告を作る
        run: |
          set -o pipefail
          ./gradlew coverageReport \
            -PcoverageExecDir=${{ runner.temp }}/backend \
            -PcoverageClassesDir=${{ runner.temp }}/backend/backend-classes 2>&1 | tee "$RUNNER_TEMP/coverage-report.log"
          if grep -q 'does not match' "$RUNNER_TEMP/coverage-report.log"; then
            echo "::warning::JaCoCo のクラスの不一致の警告がある。各ジョブがコンパイルしたクラスが違うため、カバレッジが正しくない可能性がある"
          fi

      - name: カバレッジの合計を summary に書く
        run: node ../../scripts/ci/report/coverage-summary.mjs バックエンド build/reports/jacoco/coverageReport/coverageReport.xml

      - name: カバレッジの報告を保存
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: backend/ecsite/build/reports/jacoco/coverageReport/
          if-no-files-found: ignore
          retention-days: 7

      # 基準（scripts/ci/report/quality-baseline.json）を下回ると失敗にする。報告の保存の後に置き、失敗しても報告を残す
      - name: カバレッジの基準の検査
        run: node ../../scripts/ci/report/coverage-baseline.mjs backend build/reports/jacoco/coverageReport/coverageReport.xml

  admin:
    name: 管理画面
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/admin

    steps:
      - uses: actions/checkout@v7

      # pnpm と Node の準備、workspace の依存のインストール
      - uses: ./.github/actions/setup-frontend

      # 型チェックとビルドは、admin.yaml から型を生成してから行う（生成物はコミットしない）
      - name: lint と整形の確認
        run: pnpm lint

      - name: 型チェック
        run: pnpm typecheck

      - name: テスト
        run: pnpm test

      # カバレッジ（テストの書き方 第 1 節）。基準の検査は、ジョブの最後の手順で行う
      - name: カバレッジの合計を summary に書く
        if: always()
        run: node ../../scripts/ci/report/coverage-summary.mjs 管理画面 coverage/coverage-summary.json

      - name: カバレッジの報告を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-admin
          path: frontend/admin/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: ビルド
        run: pnpm build
        env:
          # 本番ビルドは IdP の設定がなければ失敗する。CI はローカルの IdP の値で確認する（realm の JSON と同じ）
          VITE_OIDC_AUTHORITY: http://localhost:8180/realms/ec-admin
          VITE_OIDC_CLIENT_ID: ec-admin-web

      # 基準（scripts/ci/report/quality-baseline.json）を下回ると失敗にする。ビルドが失敗したときも流して、両方の失敗を見えるようにする
      - name: カバレッジの基準の検査
        if: always()
        run: node ../../scripts/ci/report/coverage-baseline.mjs admin coverage/coverage-summary.json

  store:
    name: 店舗画面
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/store

    steps:
      - uses: actions/checkout@v7

      # pnpm と Node の準備、workspace の依存のインストール
      - uses: ./.github/actions/setup-frontend

      # workspace のすべての依存（開発用を含む）のライセンスを、方針と照合する（依存とライセンス）
      - name: 依存のライセンスの検査
        working-directory: .
        run: node scripts/ci/licenses/check-frontend.mjs

      # 共有のパッケージは管理画面と店舗画面の両方が使う。ここでまとめて確認する
      - name: 共有のパッケージの lint・型チェック・テスト
        working-directory: frontend/shared
        run: pnpm lint && pnpm typecheck && pnpm test

      # 共有のパッケージのカバレッジ（管理画面・店舗画面と同じ v8 の設定）。基準の検査は、ジョブの最後の手順で行う
      - name: 共有のパッケージのカバレッジの合計を summary に書く
        if: always()
        run: node ../../scripts/ci/report/coverage-summary.mjs 共有パッケージ coverage/coverage-summary.json
        working-directory: frontend/shared

      - name: 共有のパッケージのカバレッジの報告を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shared
          path: frontend/shared/coverage/
          if-no-files-found: ignore
          retention-days: 7

      # 型チェックとビルドは、store.yaml から型を生成してから行う（生成物はコミットしない）
      - name: lint と整形の確認
        run: pnpm lint

      - name: 型チェック
        run: pnpm typecheck

      - name: テスト
        run: pnpm test

      # カバレッジ（テストの書き方 第 1 節）。基準の検査は、ジョブの最後の手順で行う
      - name: カバレッジの合計を summary に書く
        if: always()
        run: node ../../scripts/ci/report/coverage-summary.mjs 店舗画面 coverage/coverage-summary.json

      - name: カバレッジの報告を保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-store
          path: frontend/store/coverage/
          if-no-files-found: ignore
          retention-days: 7

      # 画面はリクエストのたびに作るので、ビルドにバックエンドは必要ない
      - name: ビルド
        run: pnpm build

      # 基準（scripts/ci/report/quality-baseline.json）を下回ると失敗にする。ビルドが失敗したときも流して、両方の失敗を見えるようにする
      - name: カバレッジの基準の検査
        if: always()
        run: node ../../scripts/ci/report/coverage-baseline.mjs store coverage/coverage-summary.json

      # 1 つの手順にまとめると、店舗画面が失敗したときに共有のパッケージが流れないので、手順を分ける
      - name: 共有のパッケージのカバレッジの基準の検査
        if: always()
        run: node ../../scripts/ci/report/coverage-baseline.mjs shared ../shared/coverage/coverage-summary.json

  # CI の検査の script（scripts/ci/check-all.sh）は、文書だけの push でも実行するため docs.yml で実行する

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ほかのジョブを待たずに始める（CI の全体の時間を短くするため。plan 011 第 4.2 節）。
    # E2E は自分でバックエンドをコンパイルし画面をビルドするので、ほかのジョブの結果は使わない。
    # 失敗したときは、部分のジョブの結果を先に見る（docs/guides/ci.md）

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # pnpm と Node の準備、workspace の依存のインストール
      - uses: ./.github/actions/setup-frontend

      # E2E 用の DB と IdP の置き場所（PostgreSQL）と、IdP が送るメールの受け手（Mailpit）。
      # docker/compose.yaml（ルートの .env が指す）をそのまま使う。E2E 用の DB・Keycloak（profile e2e）の再作成と起動は、
      # pnpm test の準備の script（e2e/scripts/prepare.ts）が手元と同じように行う（plan 004 第 6.1 節）
      - name: DB・メールの起動
        run: docker compose up -d --wait postgres mailpit

      # 画像の置き場所（S3 互換）と変換（imgproxy）。バケット、CORS、公開の設定は、compose の初期化のコンテナで作る（plan 001 第 7 節）
      - name: 画像の置き場所（SeaweedFS）と変換（imgproxy）の起動
        run: |
          docker compose up -d --wait seaweedfs imgproxy
          docker compose run --rm seaweedfs-init

      - name: lint と整形の確認、型チェック
        working-directory: e2e
        run: pnpm lint && pnpm typecheck

      # Playwright のブラウザーはキャッシュする（キーは Playwright の版）
      - name: Playwright の版
        id: playwright
        working-directory: e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: ブラウザーのキャッシュ
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # OS の依存（--with-deps、install-deps）は入れない。Chromium が使うライブラリは、ランナーのイメージに入っている。
      # 依存の導入が足すのはフォントなどで、CI で流す e2e/tests の結果に影響しない（画面の撮影は CI で流さない）。
      # 一方、apt の取得は外部のミラーが遅いと数分から 30 分かかり、E2E のジョブ全体を止めることがある。
      # 失敗時の画面の撮影（screenshot: 'only-on-failure'）では、日本語のフォントがなく文字が四角になることがある。
      # 読めないときは、手元の scripts/dev/e2e.sh で再現する
      - name: ブラウザーのインストール
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: e2e
        run: pnpm exec playwright install chromium

      # E2E の準備（DB と IdP の再作成）の後に、バックエンド（local,e2e profile）、管理画面、店舗画面を
      # playwright.config.ts が起動する
      - name: E2E
        working-directory: e2e
        run: pnpm test

      - name: Playwright のレポートを保存（失敗時）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
